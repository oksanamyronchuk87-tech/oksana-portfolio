backend:
  name: github
  repo: oksanamyronchuk87-tech/oksana-portfolio
  branch: main
  skip_ci: true

media_folder: /public/uploads
public_folder: /uploads

media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 90
          width: 2400
          height: 2400
        svg:
          optimize: true
  cloudinary:
    config:
      cloud_name: itg6ttpn
      api_key: '936911598121987'
      upload_preset: portfolio_video

collections:
  - name: homepage
    label: Homepage
    files:
      - name: homepage
        label: Homepage
        file: /src/content/homepage/homepage.yml
        fields:
          - label: Hero Top Label
            name: heroEyebrow
            widget: string

          - label: Hero Subtitle
            name: heroSubtitle
            widget: text

          - label: Hero Showreel
            name: heroShowreel
            widget: object
            fields:
              - label: Enabled
                name: enabled
                widget: boolean
                default: false

              - label: Video
                name: video
                widget: file
                required: false
                accept: "video/*"
                media_library:
                  name: cloudinary

              - label: Poster
                name: poster
                widget: image
                required: false

          - label: Selected Work Heading
            name: selectedWorkHeading
            widget: text

          - label: Selected Work Description
            name: selectedWorkNote
            widget: text

          - label: Explore by Category Heading
            name: categoryHeading
            widget: text

          - label: Explore by Category Description
            name: categoryNote
            widget: text

          - label: Services Section Label
            name: servicesEyebrow
            widget: string

          - label: Services Intro Text
            name: servicesIntro
            widget: text

          - label: Services List
            name: services
            widget: list
            field:
              label: Service
              name: service
              widget: string

          - label: Final CTA Heading
            name: ctaHeading
            widget: text

          - label: Final CTA Subtitle
            name: ctaSubtitle
            widget: string

  - name: about
    label: About
    files:
      - name: about
        label: About
        file: /src/content/about/about.json
        fields:
          - label: Section Label
            name: eyebrow
            widget: string

          - label: Headline Sentence
            name: lede
            widget: text

          - label: Body Text
            name: body
            widget: text

          - label: Portrait Image
            name: portraitImage
            widget: image

  - name: settings
    label: Site Settings
    files:
      - name: settings
        label: Site Settings
        file: /src/content/settings/settings.yml
        fields:
          - label: Name
            name: name
            widget: string

          - label: Professional Title
            name: professionalTitle
            widget: string

          - label: Instagram URL
            name: instagramUrl
            widget: string

          - label: Email Address
            name: email
            widget: string

          - label: Upwork URL
            name: upworkUrl
            widget: string

          - label: Footer Year
            name: footerYear
            widget: string

          - label: SEO Title
            name: seoTitle
            widget: string

          - label: SEO Description
            name: seoDescription
            widget: text

          - label: Social Sharing Image
            name: socialImage
            widget: image
            required: false

  - name: projects
    label: Projects
    label_singular: Project
    folder: /src/content/projects
    create: true
    extension: md
    format: frontmatter
    identifier_field: title

    fields:
      - label: Project Title
        name: title
        widget: string

      - label: Short Description
        name: description
        widget: text
        required: false

      - label: Category
        name: category
        widget: select
        options:
          - product-photography
          - lifestyle-campaigns
          - fashion
          - ai-video
          - ugc-avatars
          - cgi-video
        default: product-photography

      - label: Year
        name: year
        widget: string
        required: false

      - label: Cover Image
        name: coverImage
        widget: image

      - label: Cover Image Shape
        name: coverOrientation
        widget: select
        options:
          - portrait
          - landscape
          - square
        required: true
        default: portrait

      - label: Gallery Images
        name: gallery
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - label: Image
            name: image
            widget: image

          - label: Photo Title
            name: title
            widget: string
            required: false

      - label: Videos
        name: videos
        widget: list
        required: false
        summary: "{{fields.file}}"
        fields:
          - label: Video Source
            name: sourceType
            widget: select
            options:
              - upload
              - external
            default: upload

          - label: Upload Video
            name: file
            widget: file
            required: false
            accept: "video/*"
            media_library:
              name: cloudinary

          - label: External Video URL
            name: externalUrl
            widget: string
            required: false

          - label: Video Poster
            name: poster
            widget: image
            required: false

      - label: Display Order
        name: order
        widget: number
        value_type: int
        default: 1

      - label: Show in Selected Work
        name: featured
        widget: boolean
        default: false

      - label: Published
        name: published
        widget: boolean
        default: true
