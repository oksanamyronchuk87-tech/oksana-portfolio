backend:
  name: github
  repo: oksanamyronchuk87-tech/oksana-portfolio
  branch: main

media_folder: /public/uploads
public_folder: /uploads

collections:
  - name: homepage
    label: Home Page
    files:
      - name: homepage
        label: Home Page
        file: /src/content/homepage/homepage.yml
        fields:
          - label: Hero Eyebrow
            name: heroEyebrow
            widget: string

          - label: Hero Subtitle
            name: heroSubtitle
            widget: text

          - label: Hero Showreel
            name: heroShowreel
            widget: object
            fields:
              - label: Enabled
                name: enabled
                widget: boolean
                default: true

              - label: Video
                name: video
                widget: string
                required: false

              - label: Poster
                name: poster
                widget: image
                required: false

          - label: Selected Work Heading
            name: selectedWorkHeading
            widget: string

          - label: Selected Work Note
            name: selectedWorkNote
            widget: text

          - label: Categories Heading
            name: categoryHeading
            widget: string

          - label: Categories Note
            name: categoryNote
            widget: text

          - label: Services Eyebrow
            name: servicesEyebrow
            widget: string

          - label: Services Intro
            name: servicesIntro
            widget: text

          - label: Services
            name: services
            widget: list

          - label: CTA Heading
            name: ctaHeading
            widget: string

          - label: CTA Subtitle
            name: ctaSubtitle
            widget: text

  - name: about
    label: About
    files:
      - name: about
        label: About
        file: /src/content/about/about.json
        fields:
          - label: About Eyebrow
            name: eyebrow
            widget: string

          - label: About Main Heading
            name: lede
            widget: text

          - label: About Text
            name: body
            widget: text

          - label: About Photo
            name: portraitImage
            widget: image

  - name: projects
    label: Projects
    label_singular: Project
    folder: /src/content/projects
    create: true
    extension: md
    format: frontmatter
    identifier_field: title

    fields:
      - label: Project Title
        name: title
        widget: string

      - label: Short Description
        name: description
        widget: text
        required: false

      - label: Category
        name: category
        widget: select
        options:
          - product-photography
          - lifestyle-campaigns
          - fashion
          - ai-video
          - ugc-avatars
          - cgi-video

      - label: Year
        name: year
        widget: string
        required: false

      - label: Cover Image
        name: coverImage
        widget: image

      - label: Cover Image Shape
        name: coverOrientation
        widget: select
        options:
          - portrait
          - landscape
          - square
        required: false

      - label: Gallery Images
        name: gallery
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - label: Image
            name: image
            widget: image

          - label: Photo Title
            name: title
            widget: string
            required: false

      - label: Video
        name: video
        widget: object
        required: false
        fields:
          - label: Video Source
            name: sourceType
            widget: select
            options:
              - upload
              - external
            default: upload

          - label: Upload Video
            name: file
            widget: file
            required: false
            accept: "video/*"

          - label: External Video URL
            name: externalUrl
            widget: string
            required: false

          - label: Video Preview
            name: poster
            widget: image
            required: false

      - label: Display Order
        name: order
        widget: number
        value_type: int
        default: 1

      - label: Show in Selected Work
        name: featured
        widget: boolean
        default: false

      - label: Published
        name: published
        widget: boolean
        default: true
